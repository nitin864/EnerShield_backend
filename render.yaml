services:
  - type: web
    name: enerShield-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5-20251001
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_PROVIDER
        value: groq
      - key: NEWSAPI_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: INGEST_INTERVAL_MINUTES
        value: "15"
      - key: USE_SEEDED_FALLBACK
        value: "true"